<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
    <head>
        <title>Electrosa - Realizar pedido</title>
        <link rel="stylesheet" th:href="@{/static/assets/css/pedido.css}"/>
    </head>
    <body>
        <main layout:fragment="main-content">
            <div class="pedido-content">

                <div class="sidebar-sticky" th:replace="~{layout_ menu_cliente :: menu-cliente}"></div>

                <div class="pedido-container">

                    <h3>Tramitar pedido</h3>
                    <p class="pedido-subtitle">Completa los datos de entrega para finalizar tu compra.</p>

                    <form class="pedido-form" th:action="@{/cliente/pedido}" method="post">

                        <div class="form-row">
                            <div class="form-field">
                                <label for="cp">Código postal</label>
                                <input type="text" id="cp" name="cp" maxlength="5" required placeholder="Ej:26004"/>
                            </div>
                            <div class="form-field">
                                <label for="ciudad">Ciudad</label>
                                <input type="text" id="ciudad" name="ciudad" maxlength="20" required placeholder="Ej:Logroño"/>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-field">
                                <label for="calle">Calle</label>
                                <input type="text" id="calle" name="calle" maxlength="50" required placeholder="Ej:C. Madre de Dios, 53"/>
                            </div>
                            <div class="form-field">
                                <label for="provincia">Provincia</label>
                                <input type="text" id="provincia" name="provincia" maxlength="35" required placeholder="Ej:La Rioja"/>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="fechaEntrega">Fecha deseada de entrega</label>
                            <input type="date" id="fechaEntrega" name="fechaEntrega" required/>
                        </div>

                        <div class="pedido-actions">
                            <button type="submit" class="btn-primary">Confirmar pedido</button>
                            <a th:href="@{/cliente/cesta}" class="btn-ghost">Volver a la cesta</a>
                        </div>

                    </form>

                </div>
            </div>
        </main>
    </body>
</html>
