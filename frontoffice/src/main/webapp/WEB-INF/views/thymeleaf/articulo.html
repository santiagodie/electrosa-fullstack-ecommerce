<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="'Electrosa - ' + ${articulo.nombre}">Electrosa - Artículo</title>
</head>
<body>
<main layout:fragment="main-content">

    <div class="product-container">
        <div class="container">

            <div class="product-box">

                <div class="product-featured">

                    <!-- Breadcrumb -->
                    <nav style="margin-bottom: 16px; font-size: var(--fs-7); color: var(--sonic-silver);">
                        <a th:href="@{/catalogo}" style="color: var(--salmon-pink);">Catálogo</a>
                        &nbsp;/&nbsp;
                        <span th:text="${articulo.nombre}"></span>
                    </nav>

                    <h1 class="product-title" th:text="${articulo.nombre}">Nombre del artículo</h1>

                    <div class="showcase-wrapper">
                        <div class="showcase-container">
                            <div class="showcase">

                                <div class="showcase-banner">
                                    <img th:src="@{/static/assets/images/store/{foto}(foto=${articulo.foto})}" th:alt="${articulo.nombre}" class="showcase-img" style="min-height: 250px;"/>
                                </div>

                                <div class="showcase-content">

                                    <!-- Estrellas de valoración -->
                                    <div class="showcase-rating">
                                        <ion-icon name="star"></ion-icon>
                                        <ion-icon name="star"></ion-icon>
                                        <ion-icon name="star"></ion-icon>
                                        <ion-icon name="star-outline"></ion-icon>
                                        <ion-icon name="star-outline"></ion-icon>
                                    </div>

                                    <p style="font-size: var(--fs-7); color: var(--sonic-silver); margin-bottom: 8px;">
                                        Ref: <span th:text="${articulo.codigo}"></span>
                                    </p>

                                    <h3 class="showcase-title" th:text="${articulo.nombre}">nombre</h3>

                                    <p class="showcase-desc" th:text="${articulo.descripcion}">Descripción</p>

                                    <div class="price-box">
                                        <p class="price">
                                            <span th:text="${articulo.pvp}"></span>&euro;
                                        </p>
                                    </div>

                                    <!-- Formulario POST para añadir al carrito -->
                                    <form th:action="@{/cliente/cesta}" method="post">
                                        <input type="hidden" name="codigoArticulo" th:value="${articulo.codigo}"/>
                                        <button class="add-cart-btn" type="submit">Añadir al carrito</button>
                                    </form>

                                    <!-- Stock -->
                                    <div class="showcase-status">
                                        <div class="wrapper">
                                            <p>Disponible: <b th:text="${articulo.stock}">-</b></p>
                                        </div>
                                        <div class="showcase-status-bar"></div>
                                    </div>

                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Sidebar info entrega (del template del profesor) -->
            <div class="sidebar showcase-container"
                 style="border: 1px solid var(--cultured);
                        border-radius: var(--border-radius-md);
                        padding: 10px; margin-top: 88px;
                        color: var(--sonic-silver);
                        font-size: var(--fs-7);
                        font-weight: var(--weight-300);">
                <div style="margin: 14px 0;">
                    <ion-icon name="stopwatch-outline" style="display: inline-block"></ion-icon>
                    Entrega en 3 a 4 días laborables
                </div>
                <div style="margin: 14px 0;">
                    <ion-icon name="cube-outline" style="display: inline-block"></ion-icon>
                    Gastos de envío 0&euro;
                </div>
                <div style="margin: 14px 0;">
                    <ion-icon name="checkmark-circle-outline" style="display: inline-block"></ion-icon>
                    Artículo con 100 días de <a href="#" style="color: var(--salmon-pink);">prueba y devolución gratuita</a>.
                </div>
                <div style="margin: 14px 0;">
                    <ion-icon name="gift-outline" style="display: inline-block"></ion-icon>
                    Recogida y reciclaje gratuito
                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
