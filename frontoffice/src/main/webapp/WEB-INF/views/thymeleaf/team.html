<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
    <head>
        <title>Electrosa - Nuestro equipo</title>
    </head>
    <body>
        <main layout:fragment="main-content">
            <div>

                <div class="container">

                    <div class="testimonials-box mt40">

                        <div class="testimonial mt60">

                            <div class="testimonial-card">

                                <img th:src="@{/static/assets/images/legacy/logo-electrosa-retro.png}" alt="student" class="testimonial-banner hw100"/>

                                <p class="testimonial-name">Santiago Die</p>

                                <p class="testimonial-title">Estudiante del Grado en Ingeniería Informática</p>

                            </div>

                        </div>

                        <!--
                          - CTA
                        -->

                        <div class="cta-container">
                            <h1>Nuestro equipo</h1>

                            <p>
                                Somos estudiantes de Programación de Aplicaciones Web en la Universidad de La Rioja.
                            </p>

                            <img th:src="@{/static/assets/images/team/olly-3767411.jpg}" alt="student" class="tea-image"/>
                        </div>

                        <!--
                          - SERVICE
                        -->

                        <div class="service mt60">

                            <div class="service-container">
                                <a href="https://github.com/sadie27" class="service-item">
                                    <div class="service-icon">
                                        <ion-icon name="logo-github"></ion-icon>
                                    </div>
                                    <div class="service-content">
                                        <h3 class="service-title">GitHub</h3>
                                        <p class="service-desc">@sadie27</p>
                                    </div>
                                </a>

                                <a href="#" class="service-item">
                                    <div class="service-icon">
                                        <ion-icon name="logo-java"></ion-icon>
                                    </div>
                                    <div class="service-content">
                                        <h3 class="service-title">Java</h3>
                                        <p class="service-desc">Spring MVC</p>
                                    </div>
                                </a>

                                <a href="#" class="service-item">
                                    <div class="service-icon">
                                        <ion-icon name="logo-css3"></ion-icon>
                                    </div>
                                    <div class="service-content">
                                        <h3 class="service-title">CSS</h3>
                                        <p class="service-desc">Thymeleaf + Layout Dialect</p>
                                    </div>
                                </a>

                                <a href="#" class="service-item">
                                    <div class="service-icon">
                                        <ion-icon name="logo-javascript"></ion-icon>
                                    </div>
                                    <div class="service-content">
                                        <h3 class="service-title">JavaScript</h3>
                                        <p class="service-desc">Empezando</p>
                                    </div>
                                </a>

                                <a href="#" class="service-item">
                                    <div class="service-icon">
                                        <ion-icon name="school"></ion-icon>
                                    </div>
                                    <div class="service-content">
                                        <h3 class="service-title">Casi ingenier@</h3>
                                        <p class="service-desc">Universidad de La Rioja</p>
                                    </div>
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </body>
</html>
