<!DOCTYPE html>
<html layout:decorate="~{layout}">
    <head>
        <title>Electrosa - Detalle del pedido anulado</title>
        <link rel="stylesheet" th:href="@{/static/assets/css/pedidos.css}" />
    </head>
    <body>
        <main layout:fragment="main-content">
            <div class="pedidos-content">

                <div th:replace="layout_ menu_cliente :: menu-cliente"></div>

                <div class="pedidos-container">

                    <div class="pedido-detail-header">
                        <h2 class="title">Pedido #<span th:text="${pedidoanulado.codigo}"></span></h2>
                        <div class="estado_anulado">Anulado</div>
                    </div>

                    <div class="pedido-box-detalle">
                        <div class="pedidos_info">
                            <p><strong>Fecha cierre:</strong> <span th:text="${#dates.format(pedidoanulado.Fechacierre, 'dd/MM/yyyy')}"></span></p>
                            <p><strong>Fecha anulación:</strong> <span th:text="${#dates.format(pedidoanulado.Fechaanulacion, 'dd/MM/yyyy HH:mm')}"></span></p>

                            <h3>Artículos</h3>

                            <div class="product-grid">
                                <div class="showcase" th:each="l : ${pedidoanulado.lineas}">
                                    <div class="showcase-banner">
                                        <a th:href="@{/catalogo/{articuloId}(articuloId=${l.articulo.codigo})}">
                                            <img th:src="@{/static/assets/images/store/{foto}(foto=${l.articulo.foto})}"
                                                 th:alt="${l.articulo.nombre}"
                                                 class="product-img" />
                                        </a>
                                    </div>
                                    <div class="showcase-content">
                                        <p class="showcase-code" th:text="${l.articulo.codigo}"></p>
                                        <a th:href="@{/catalogo/{articuloId}(articuloId=${l.articulo.codigo})}">
                                            <h3 class="showcase-title" th:text="${l.articulo.nombre}"></h3>
                                        </a>
                                        <p><strong>Cantidad:</strong> <span th:text="${l.cantidad}"></span></p>
                                        <p><strong>Precio:</strong> <span th:text="${l.articulo.pvp}"></span> &euro;</p>
                                    </div>
                                </div>
                            </div>

                            <p><strong>Importe total:</strong> <span th:text="${importe}"></span> &euro;</p>
                            <a th:href="@{/cliente/pedidos/anulados}" class="btn">&larr; Volver</a>
                        </div>

                        <div class="estado_pedido_detalle">
                            <div class="estado_anulado">Anulado</div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </body>
</html>
