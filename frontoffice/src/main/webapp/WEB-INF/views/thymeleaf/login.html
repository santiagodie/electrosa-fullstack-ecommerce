<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Iniciar sesión - Electrosa</title>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <link rel="apple-touch-icon" sizes="180x180" th:href="@{/static/assets/images/logo/apple-touch-icon.png}"/>
        <link rel="icon" type="image/png" sizes="32x32" th:href="@{/static/assets/images/logo/favicon-32x32.png}"/>
        <link rel="icon" type="image/png" sizes="16x16" th:href="@{/static/assets/images/logo/favicon-16x16.png}"/>

        <link rel="stylesheet" th:href="@{/static/assets/css/style.css}"/>
        <link rel="stylesheet" th:href="@{/static/assets/css/custom.css}"/>
        <link rel="stylesheet" th:href="@{/static/assets/css/login.css}"/>
    </head>
    <body>

        <div class="login-root">

            <!-- ===========================
                 PANEL IZQUIERDO — Marca
                 =========================== -->
            <aside class="login-brand" aria-hidden="true">
                <div class="brand-inner">
                    <div class="title_animation">
                        <span class="actual-text">&nbsp;ELECTROSA&nbsp;</span>
                        <span class="hover-text">&nbsp;ELECTROSA&nbsp;</span>
                    </div>
                    <div class="brand-accent-line"></div>
                    <p class="brand-tagline">Tu hogar, nuestra pasión.</p>
                </div>
            </aside>

            <!-- ===========================
                 PANEL DERECHO — Formulario
                 =========================== -->
            <main class="login-form-panel">
                <div class="login_container">

                    <!-- Encabezado del formulario -->
                    <header class="form-header">
                        <h1 class="form-header__title">Bienvenido</h1>
                        <p class="form-header__subtitle">Accede a tu cuenta Electrosa</p>
                    </header>

                    <!-- Error general -->
                    <div class="message_error_container">
                        <div th:if="${errorMensaje}">
                            <div class="error" th:text="${errorMensaje}"></div>
                        </div>
                    </div>

                    <!-- Formulario de login -->
                    <div class="login_details_wrapper">
                        <form method="post" th:action="@{/auth/login}">

                            <!-- Usuario -->
                            <div class="field-group">
                                <label class="field-label" for="login_username">Usuario</label>
                                <div class="username_wrapper">
                                    <span class="username_icon" aria-hidden="true">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                        </svg>
                                    </span>
                                    <input type="text"
                                           id="login_username"
                                           name="login_username"
                                           th:value="${username}"
                                           placeholder="Tu nombre de usuario"
                                           autocomplete="username"
                                           required />
                                </div>
                                <div class="message_error_username">
                                    <div th:if="${errorUsername}">
                                        <span class="error" th:text="${errorUsername}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="field-group">
                                <label class="field-label" for="login_password">Contraseña</label>
                                <div class="password_wrapper">
                                    <span class="password_icon" aria-hidden="true">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path d="M12 2C8.13 2 5 5.13 5 9v2H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1h-1V9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5v2H7V9c0-2.76 2.24-5 5-5zm0 9c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1v-2c0-.55.45-1 1-1z"/>
                                        </svg>
                                    </span>
                                    <input type="password"
                                           id="login_password"
                                           name="login_password"
                                           placeholder="Tu contraseña"
                                           autocomplete="current-password"
                                           required />
                                </div>
                                <div class="message_error_password">
                                    <div th:if="${errorPassword}">
                                        <span class="error" th:text="${errorPassword}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Botón -->
                            <div class="button_wrapper">
                                <button type="submit" class="btn_login">
                                    <span>Iniciar sesión</span>
                                    <div class="login_arrow" aria-hidden="true"></div>
                                </button>
                            </div>

                        </form>

                        <!-- Crear cuenta -->
                        <div class="crear_usuario">
                            <p>¿Aún no tienes cuenta?</p>
                            <div class="line">
                                <span class="line-icon" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V8H4v2H2v2h2v2h2v-2h2v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                    </svg>
                                </span>
                                <a th:href="@{/auth/register}">Crear cuenta</a>
                            </div>
                        </div>

                    </div><!-- /login_details_wrapper -->

                </div><!-- /login_container -->
            </main>

        </div><!-- /login-root -->

    </body>
</html>
