<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
    <head>
        <title>Electrosa - Catálogo</title>
    </head>
    <body>
        <main layout:fragment="main-content">
            <div class="product-container">
                <div class="container">

                    <div class="sidebar has-scrollbar" data-mobile-menu>
                        <div class="sidebar-category" style="margin-top: 90px;">
                            <div class="sidebar-top">
                                <h2 class="sidebar-title" th:text="#{filters.title}">Filtros de búsqueda</h2>
                                <button class="sidebar-close-btn" data-mobile-menu-close-btn>
                                    <ion-icon name="close-outline"></ion-icon>
                                </button>
                            </div>
                            <form class="form-cultured" th:action="@{/catalogo}" method="get">
                                <div class="control">
                                    <label th:text="#{filters.brand.title}">Fabricante:</label>
                                    <select name="fabricante">
                                        <option value="" th:text="#{filters.options.any}">-- Cualquiera --</option>
                                        <option th:each="f : ${fabricantes}" th:value="${f}" th:text="${f}" th:selected="${f == fabricanteSeleccionado}"></option>
                                    </select>
                                </div>
                                <div class="control">
                                    <label th:text="#{filters.category.title}">Tipo:</label>
                                    <select name="tipo">
                                        <option value="" th:text="#{filters.options.any}">-- Cualquiera --</option>
                                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == tipoSeleccionado}"></option>
                                    </select>
                                </div>
                                <div class="control">
                                    <label th:text="#{filters.price.title}">Precio</label>
                                    <select name="precio">
                                        <option value="" th:text="#{filters.options.any}">-- Cualquiera --</option>
                                        <option value="0-50"      th:selected="${precioSeleccionado == '0-50'}">0-50 &euro;</option>
                                        <option value="50-100"    th:selected="${precioSeleccionado == '50-100'}">50-100 &euro;</option>
                                        <option value="100-200"   th:selected="${precioSeleccionado == '100-200'}">100-200 &euro;</option>
                                        <option value="200-500"   th:selected="${precioSeleccionado == '200-500'}">200-500 &euro;</option>
                                        <option value="500-99999" th:selected="${precioSeleccionado == '500-99999'}">Más de 500 &euro;</option>
                                    </select>
                                </div>
                                <div style="margin-top: 30px;">
                                    <button class="banner-btn" type="submit" style="width: 100%;" th:text="#{filters.button}">
                                        Aplicar filtros
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- CONTENIDO -->
                    <div class="product-box">
                        <div class="product-main">
                            <h1 class="title" th:text="#{catalog.title}">Catálogo de productos</h1>

                            <div class="empty-result" th:if="${#lists.isEmpty(articulos)}">
                                <p th:text="#{catalog.empty}"></p>
                                <a th:href="@{/catalogo}" th:text="#{catalog.title}"></a>
                            </div>

                            <th:block th:unless="${#lists.isEmpty(articulos)}">

                                <!-- Paginador -->
                                <div class="paginator-wrapper" th:if="${totalPages > 1}">
                                    <a th:if="${currentPage > 0}"
                                       th:href="@{/catalogo(page=0, fabricante=${fabricanteSeleccionado}, tipo=${tipoSeleccionado}, precio=${precioSeleccionado})}"
                                       th:text="#{paginator.first}">Primero</a>
                                    <a th:if="${currentPage > 0}"
                                       th:href="@{/catalogo(page=${currentPage - 1}, fabricante=${fabricanteSeleccionado}, tipo=${tipoSeleccionado}, precio=${precioSeleccionado})}"
                                       th:text="#{paginator.previous}">Anterior</a>
                                    <span class="current"
                                          th:text="'Mostrando página ' + (${currentPage} + 1) + ' de ' + ${totalPages}"></span>
                                    <a th:if="${currentPage < totalPages - 1}"
                                       th:href="@{/catalogo(page=${currentPage + 1}, fabricante=${fabricanteSeleccionado}, tipo=${tipoSeleccionado}, precio=${precioSeleccionado})}"
                                       th:text="#{paginator.next}">Siguiente</a>
                                    <a th:if="${currentPage < totalPages - 1}"
                                       th:href="@{/catalogo(page=${totalPages - 1}, fabricante=${fabricanteSeleccionado}, tipo=${tipoSeleccionado}, precio=${precioSeleccionado})}"
                                       th:text="#{paginator.last}">Último</a>
                                </div>

                                <div class="pagination-info">
                                    <label th:text="#{paginator.page.size}">Artículos por página:</label>
                                    <span class="pagesize">15</span>
                                    <span class="records-found">([[ #{paginator.page.total(${totalElements})} ]])</span>
                                </div>

                                <div class="product-grid">
                                    <div class="showcase" th:each="articulo : ${articulos}">

                                        <div class="showcase-banner">
                                            <a th:href="@{/catalogo/{id}(id=${articulo.codigo})}">
                                                <img th:src="@{/static/assets/images/store/{foto}(foto=${articulo.foto})}" th:alt="${articulo.nombre}" style="max-height: 150px;" class="product-img"/>
                                            </a>

                                            <p class="showcase-badge"
                                               th:if="${ofertas != null and ofertas[articulo.codigo] != null}"
                                               th:text="'-' + ${T(java.lang.Math).round(
                                               ofertas[articulo.codigo].descuento.doubleValue() > 1
                                               ? ofertas[articulo.codigo].descuento.doubleValue()
                                               : ofertas[articulo.codigo].descuento.doubleValue() * 100
                                               )} + '%'">
                                            </p>

                                            <div class="showcase-actions">
                                                <button class="btn-action wishlist-add" th:id="${articulo.codigo}">
                                                    <ion-icon name="heart-outline"></ion-icon>
                                                </button>
                                                <button class="btn-action">
                                                    <ion-icon name="eye-outline"></ion-icon>
                                                </button>
                                                <button class="btn-action">
                                                    <ion-icon name="bag-add-outline"></ion-icon>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="showcase-content">
                                            <span th:text="${articulo.codigo}"></span>

                                            <a th:href="@{/catalogo/{id}(id=${articulo.codigo})}">
                                                <h3 class="showcase-title" th:text="${articulo.nombre}"></h3>
                                            </a>

                                            <div class="showcase-rating">
                                                <div class="showcase-rating" th:with="rating=${T(java.lang.Math).min(5, T(java.lang.Math).max(0, articulo.rating))},vacias=${5 - rating}">
                                                    <ion-icon name="star" th:each="i : ${#numbers.sequence(1, rating)}"></ion-icon>
                                                    <ion-icon name="star-outline" th:if="${vacias > 0}" th:each="i : ${#numbers.sequence(1, vacias)}"></ion-icon>
                                                </div>
                                            </div>

                                            <div class="price-box" th:if="${ofertas != null and ofertas[articulo.codigo] != null}">
                                                <del th:text="${preciosConDescuento[articulo.codigo]} + ' €'"></del>
                                                <p class="price" th:text="${articulo.pvp} + ' €'"></p>
                                            </div>
                                            <div class="price-box" th:unless="${ofertas != null and ofertas[articulo.codigo] != null}">
                                                <p class="price" th:text="${articulo.pvp} + ' €'"></p>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                            </th:block>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </body>
</html>
